# claude_opt: 車体パラメータは /** (このファイルを読む全ノード共通) に一本化。
#   旧構成は epos4_controller_node / epos4_odometry_node に同じ値が二重に書かれており、
#   変更時の同期漏れの温床だった。ノード固有パラメータのみ各ノードのセクションに残す。
#   注意: rcl の yaml パーサは YAML アンカー(&/*)を解釈しないため、共通化は /** で行うこと。
/**:
  ros__parameters:
    tread_width: 0.41 #[m]
    tire_diam: 0.15   #[m]
    gear_ratio: 1.25  #measured: raw 78.55rad/10rev = 7.855rad/rev = 2.5pi; /2pi = 1.25 # claude
    invert_left: true
    invert_right: true

epos4_controller_node:
  ros__parameters:
    # claude_robust: /robot_speed_cmd がこの秒数途絶えたら速度 0 (デッドマン)。0 で無効
    cmd_timeout_sec: 0.5
    # claude_robust: statusword(0x6041) 監視周期 [s]。FAULT/励磁喪失を変化時ログ。0 で無効
    motor_status_period_sec: 2.0

epos4_odometry_node:
  ros__parameters:
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    publish_tf: true
    # claude_robust: 1 更新あたりの車輪移動がこれ [m] を超えたら積分せず基準取り直し。0 で無効
    pose_jump_threshold: 0.5
