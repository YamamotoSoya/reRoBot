epos4_controller_node:
  ros__parameters:
    tread_width: 0.41 #[m]
    tire_diam: 0.15   #[m]
    gear_ratio: 5.0   # motor_rev / wheel_rev (物理ギヤ比 5:1)。エンコーダ較正は bus.yml 側 (2π/1024) に修正済み 2026-07-29 # claude
    invert_left: true
    invert_right: true

epos4_odometry_node:
  ros__parameters:
    tread_width: 0.41 #[m]
    tire_diam: 0.15   #[m]
    gear_ratio: 5.0   # motor_rev / wheel_rev (物理ギヤ比 5:1)。エンコーダ較正は bus.yml 側 (2π/1024) に修正済み 2026-07-29 # claude
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    publish_tf: true
    invert_left: true
    invert_right: true