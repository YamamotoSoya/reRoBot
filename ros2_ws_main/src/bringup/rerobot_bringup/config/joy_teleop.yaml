# ============================================================
#  Xbox / joystick teleop 設定                         # claude
#  joy_node + teleop_twist_joy_node 用の独立した設定ファイル。
#
#  ★ この機能をやめたいとき（完全撤去手順）:
#     1. このファイル (config/joy_teleop.yaml) を削除
#     2. launch/joy_teleop.launch.py を削除
#     3. package.xml の joy / teleop_twist_joy の exec_depend 2行を削除
#     → 既存の bringup / nav2 / slam launch は一切変更していないので
#       これだけで元の状態に戻ります。
# ============================================================

joy_node:
  ros__parameters:
    device_id: 0           # /dev/input/js0 を使用（複数挿す場合は番号を変える）
    deadzone: 0.05         # スティック中央の遊び（ドリフト対策）
    autorepeat_rate: 20.0  # [Hz] 入力が変化しなくても再送。teleop 側の publish を切らさない

teleop_twist_joy_node:
  ros__parameters:
    # --- 軸割り当て: Linux の Xbox コントローラ + joy ドライバ標準配置 ---
    axis_linear:
      x: 1                 # 左スティック 上下 → 前進 / 後退
    axis_angular:
      yaw: 3               # 右スティック 左右 → 旋回

    # --- スケール (= 出力の最大値)。params.yaml 系の上限に合わせる ---
    #     通常時は控えめ、turbo ボタン押下で max まで出す
    scale_linear:
      x: 0.5              # [m/s]  通常   (2026-08-31 従来の 1/2 に減速) # claude
    scale_linear_turbo:
      x: 0.8               # [m/s]  turbo  (2026-09-27 1.0 → 0.8) # claude
      #   24 V 電源ではモータが頭打ち (浮かせで左 5790 / 右 6650 rpm、1.0 m/s = 6882 rpm 指令)
      #   → 左右差で左に寄る + EPOS 速度 PI の積分ワインドアップで停止後 3〜5 s 惰性回転。
      #   0.8 m/s = 5505 rpm で頭打ち未満にする。接地では上限がさらに下がる可能性あり # claude
    scale_angular:
      yaw: 0.3             # [rad/s] 通常   (同上 1/2) # claude
    scale_angular_turbo:
      yaw: 1.0             # [rad/s] turbo  (同上 1/2) # claude

    # --- deadman（安全装置）: ボタンを押している間だけ Twist を出す ---
    enable_button: 4         # LB ボタン: これを押している間だけ走行
    enable_turbo_button: 5   # RB ボタン: 押すと turbo スケールに切替
    require_enable_button: true

# claude: 2026-10-09 停止点ティーチング用マーカー (scripts/teach_marker.py)
teach_marker:
  ros__parameters:
    button: 3              # 印字「2-Y」のボタン (手元のパッドで 2026-10-09 実機確認): 押した瞬間に /teach_marker を 1 本出す
    button_name: "2-Y"     # ログ表示用 (パッドの印字)。button を変えたら合わせる
    label_prefix: teach    # ラベル = teach_00, teach_01, ... (起動ごとに 00 から)
    still_time: 1.0        # [s] 押す前にこの時間静止していなければ WARN + "(moving)"
