# claude: 統合パラメータ (2026-08-10)。旧 params_2d.yaml / params_3d.yaml を 1 本化した。
#   従来は「epos4_* セクションは 2 ファイルで同値に保つ」という手動同期が必要だったが、
#   URDF 統合 (rerobot.urdf) に合わせて重複自体を廃止した。
#   車体パラメータの重複は epos4_teleop/config/params.yaml との間にのみ残る
#   (/params-sync skill で検査可能)。

epos4_controller_node:
  ros__parameters:
    tread_width: 0.529 #[m] 2026-08-31 実測 (旧 0.41) # claude
    tire_diam: 0.256  #[m] 2026-08-30 車体改修 (旧 0.15)、08-31 実測補正 (0.25 → 0.256) # claude
    gear_ratio: 92.25 # motor_rev / wheel_rev。2026-08-30 減速機交換 (旧 5.0)。モータ/エンコーダは同一個体 — bus.yml (2π/1024) は据え置き # claude
    # ⚠️ TODO 2026-08-30: 減速機交換で出力軸の回転方向が反転している可能性 — 浮かせ teleop で要確認 # claude
    invert_left: true
    invert_right: true
    # claude: 0x60FF 指令の加減速ランプ上限 [モータ軸 rpm/s] (2026-07-31 追加)。
    #   ステップ指令(joy 離し等)による制動電流/回生スパイクで全モータ停止した対策。
    #   換算 (tire 0.256 m, gear 92.25): 車体加速度 1 m/s² ≈ 6882 rpm/s。15000 ≈ 2.2 m/s²
    #   (最高速 1.12 m/s = モータ 7720 rpm からの停止が約 0.5 s)。EPOS4 側
    #   Max acceleration (0x60C5) = 30000 rpm/s (2026-08-30 設定) が安全網。
    max_motor_accel_rpm_per_s: 15000.0
    max_motor_decel_rpm_per_s: 15000.0
    # claude_watchdog (2026-09-19): 通信/指令途絶で止まらない層の封鎖 + フォルトコードの記録。
    #   背景: 09-19 14:57 の暴走 = master 受信側の喪失 + ゲームパッド USB 瞬断で最後の非ゼロ
    #   Twist が保持され続けた。EPOS 側の 0x8250 (RPDO timeout) は PDO が届き続ける型には無効。
    #   詳細 docs/issue/2026-09-19_epos_stop_link_loss_rpdo_timeout_power.md §6, §8。
    cmd_timeout_s: 0.5          # /robot_speed_cmd がこの秒数途絶し目標が非ゼロなら 0 へランプ (0.0 で無効)。joy は autorepeat 20 Hz、keyboard は 20 Hz publish なので通常運転では発動しない
    monitor_period_s: 0.05      # 監視ループ (状態機械) の評価周期 [s]。Fault 検出は EMCY の受動受信が主で SDO の定期ポーリングはしない (claude 2026-11-06: ~/rpdo 購読は遅延のため廃止、link_loss_timeout_s も削除)
    monitor_sdo_timeout_s: 0.3  # Fault 検知時に Vcc (0x2200:01) / コード (0x603F/0x1003) を読む SDO 1 回の待ち [s]。この時だけ driver の "SDO Read Call" INFO が数行出る
    can_interface: "can0"       # /sys/class/net/<if>/ifindex を監視。変化 = USB 再列挙で can0 が作り直された (master は旧 socket のまま → 再 launch 必須)
    # claude_recover (2026-11-06): 自動復帰と走行許可。設計 docs/features/2026-11-05_epos_auto_recovery_plan.md
    #   起動直後・非常停止の後は DISARMED (指令 0) で、パッドの Start か `ros2 service call /epos4_controller/arm std_srvs/srv/Trigger` で RUNNING。
    #   一時的な停止 (0x8130 heartbeat / 0x8250 / 段差の 0x3220) は自動で recover して元の状態に戻る。状態は /epos4_controller/state。
    vcc_ok_v: 20.0              # 0x3220 のとき、これ以上なら「段差 = 一時的」。非常停止はラッチ式で解除まで ≥3 s なので Fault 直後は必ず下回る
    vcc_read_deadline_s: 1.0    # 0x3220 の Vcc は Fault (EMCY) からこの秒数以内に読めたものだけ信じる。超えた・EMCY なしは非常停止扱い (安全側)
    recover_window_s: 120.0     # 0x8130 / 0x3220 の自動復帰の数え上げ窓 [s]
    recover_per_window: 3       #   窓の中でこの回数を超えたら DISARMED (Start で再開)
    recover_per_run: 10         #   1 回の起動あたりの上限
    auto_recover_8250: true     # 原因不明の 0x8250 も自動復帰する (2026-11-06 ユーザ決定)
    recover_8250_per_run: 3     #   0x8250 の 1 起動あたりの上限
    refault_8250_s: 30.0        #   復帰後この秒数以内に 0x8250 が再発したら DISARMED
    long_fault_s: 5.0           # Fault 検知からこの秒数で戻れなければ DISARMED
    executor_stall_s: 0.3       # timer_callback がこの秒数回らなければ監視スレッドから目標 0 を直接送る
    stall_ratio: 0.3            # 物理トリガ: 実速度 / 出力指令がこれ未満で
    stall_window_s: 0.3         #   この秒数続き
    stall_min_rpm: 300.0        #   出力指令がこれ以上 [モータ rpm] (≈0.04 m/s) のとき SDO で statusword を確かめる (EMCY を取りこぼしたとき用)
    allow_joy_when_disarmed: true  # DISARMED 中も LB か RB を握った joy (/joy_vel) は通す (2026-11-06 ユーザ決定、非常停止後の手動退避)
    joy_fresh_s: 0.2            #   /joy と /joy_vel がこの秒数以内に届いているときだけ (パッド瞬断で古い LB が残るのを防ぐ)
    arm_button: 7               # Start = 走行許可 (joy_teleop.yaml の waypoint_runner.start_button と同じ番号)
    enable_button: 4            # LB (teleop_twist_joy の enable_button と同じ番号)
    enable_turbo_button: 5      # RB (teleop_twist_joy の enable_turbo_button と同じ番号)。RB 単独でも turbo で走れるので DISARMED 中も LB と同じく通す
    joy_buttons: 11             # /joy の想定構成 (Xbox XInput: 11 ボタン・8 軸、2026-11-06 bag で確認)。違えば /joy を無視する
    joy_axes: 8

epos4_odometry_node:
  ros__parameters:
    tread_width: 0.529 #[m] 2026-08-31 実測 (旧 0.41) # claude
    tire_diam: 0.256  #[m] 2026-08-30 車体改修 (旧 0.15)、08-31 実測補正 (0.25 → 0.256) # claude
    gear_ratio: 92.25 # motor_rev / wheel_rev。2026-08-30 減速機交換 (旧 5.0)。モータ/エンコーダは同一個体 — bus.yml (2π/1024) は据え置き # claude
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    publish_tf: true   # claude_ekf: launch の ekf:=true 時は launch 側が後勝ちで false に上書き
    invert_left: true
    invert_right: true
    # claude_ekf: /odom の共分散対角 [x y z roll pitch yaw] (2026-08-11 追加)。
    #   robot_localization (ekf.yaml) の重み付けに使われる。z/roll/pitch は 2D では
    #   観測不能なので 1e6 で「信用しない」。vy=0.001 は差動駆動の横滑りなし拘束。
    # (1.0e6 の指数表記は YAML 1.1 パーサで文字列扱いになり得るため使わない)
    pose_covariance_diagonal:  [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]

# claude: R-Fans 新ドライバ surestar_rfans_ros2 (2026-08-14 刷新 —
#   docs/issue/2026-08-14_rfans_driver_renewal.md)。旧 SDK 用の theta_remap 等は廃止。
#   node 名 "rfans_driver" / "rfans_calculation" は rerobot_bringup.launch.py の
#   Node(name=...) と一致必須。model / device_ip / rps は launch 引数で上書き可 (後勝ち)。
rfans_driver:
  ros__parameters:
    # デバイス機種。R-Fans-32 / R-Fans-16 / R-Fans-V6K / C-Fans-128 / C-Fans-32
    model: "R-Fans-16"
    # LiDAR 実機の IP アドレス (UDP 受信元フィルタ)
    device_ip: "192.168.0.3"
    # LiDAR データ受信 UDP ポート
    device_port: 2014
    # スキャン速度 [Hz / rps]。5 / 10 / 20
    rps: 10
    # データレベル (デバイスのレジスタに書き込む出力フォーマット)。実機フラッシュ既定と同じ 3
    data_level: 3
    # true でデュアルエコー (2 反射)
    use_double_echo: false
    # 生パケットトピック名の末尾 (実トピック: /rfans_driver/rfans_packets)
    advertise_name: "rfans_packets"
    # 制御サービス名の末尾 (実サービス: /rfans_driver/rfans_control)
    control_name: "rfans_control"
    # pcap 再生 (実機レス)。空文字なら実機 (UDP) モード
    pcap: ""
    read_once: false
    read_fast: false
    repeat_delay: 0.0

rfans_calculation:
  ros__parameters:
    # 以下 4 つは rfans_driver 側と同値必須 (ROS2 にはグローバルパラメータが無いため両方に配る)
    model: "R-Fans-16"
    device_ip: "192.168.0.3"
    rps: 10
    data_level: 3
    use_double_echo: false
    # 点群トピック名の末尾 (実トピック: /rfans_driver/rfans_points)
    advertise_name: "rfans_points"
    subscribe_name: "rfans_packets"
    # 出力 PointCloud2 の header.frame_id。rerobot.urdf の rfans link 名と一致
    frame_id: "rfans"
    # 1 メッセージにまとめる回転角 [deg]。360 = 1 回転 1 メッセージ
    angle_duration: 360.0
    # 実回転数の監視 (2026-09-02 追加)。実測フレームレート (1 フレーム = 1 回転) が rps と
    # 25% 超ズレたら driver の rfans_control service へ速度を再指令する。デバイスは電源
    # 再投入で内部デフォルト 20 Hz に戻るため (起動時 1 発の指令は再送されない)、その対策。
    rps_watchdog: true
    # true なら header.stamp にデバイス GPS 時刻 (通常 false = ROS 時刻を回転幅ぶん巻き戻し)
    use_gps: false
    # 実測縦角オーバーライド [deg] (laserid 0..15 順、16 要素)。未設定 = 公式表 VAngle_V6B_16G。
    # 新ドライバ出力での再較正後にここへ入れる (旧較正値は fold16 汚染の疑いで使わない):
    # claude (2026-09-13): 有効化。リング 0〜5 は 2026-09-02 の床フィット実測 (新車体 flat、bag 2026-08-31_0030 静止 53 s)、
    #   リング 6〜15 は床/天井が見えず未測定のため公称値 (VAngle_V6B_16G) のまま。
    #   効果は GLIM odometry 段で傾き A −20% (3 run 再現)、global mapping 後の地図には中立。z ドリフトの主因ではない
    #   (docs/issue/2026-09-10_glim_z_drift_not_vangle.md §2.2)。外すときはこの行をコメントアウト (= 公称表)。
    # claude (2026-10-02): リング 7 (公称 −1°) を −1.62° に。/scan 地面の壁 (12-25 m) の原因候補、1 地点フィット由来の暫定値
    #   (memory: scan-ground-ghost-minus1-ring)。15-20 m の壁は 4 割減止まりの見込み。戻すときは -1.0。
    vangle_override: [-14.93, -12.97, -11.29, -9.26, -7.33, -5.49, -3.0, -1.62, 1.0, 3.0, 5.0, 7.0, 9.0, 11.0, 13.0, 15.0]
