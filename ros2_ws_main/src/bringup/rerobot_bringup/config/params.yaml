# claude: 統合パラメータ (2026-08-10)。旧 params_2d.yaml / params_3d.yaml を 1 本化した。
#   従来は「epos4_* セクションは 2 ファイルで同値に保つ」という手動同期が必要だったが、
#   URDF 統合 (rerobot.urdf) に合わせて重複自体を廃止した。
#   車体パラメータの重複は epos4_teleop/config/params.yaml との間にのみ残る
#   (/params-sync skill で検査可能)。

epos4_controller_node:
  ros__parameters:
    tread_width: 0.529 #[m] 2026-08-31 実測 (旧 0.41) # claude
    tire_diam: 0.256  #[m] 2026-08-30 車体改修 (旧 0.15)、08-31 実測補正 (0.25 → 0.256) # claude
    gear_ratio: 92.25 # motor_rev / wheel_rev。2026-08-30 減速機交換 (旧 5.0)。モータ/エンコーダは同一個体 — bus.yml (2π/1024) は据え置き # claude
    # ⚠️ TODO 2026-08-30: 減速機交換で出力軸の回転方向が反転している可能性 — 浮かせ teleop で要確認 # claude
    invert_left: true
    invert_right: true
    # claude: 0x60FF 指令の加減速ランプ上限 [モータ軸 rpm/s] (2026-07-31 追加)。
    #   ステップ指令(joy 離し等)による制動電流/回生スパイクで全モータ停止した対策。
    #   換算 (tire 0.256 m, gear 92.25): 車体加速度 1 m/s² ≈ 6882 rpm/s。15000 ≈ 2.2 m/s²
    #   (最高速 1.12 m/s = モータ 7720 rpm からの停止が約 0.5 s)。EPOS4 側
    #   Max acceleration (0x60C5) = 30000 rpm/s (2026-08-30 設定) が安全網。
    max_motor_accel_rpm_per_s: 15000.0
    max_motor_decel_rpm_per_s: 15000.0

epos4_odometry_node:
  ros__parameters:
    tread_width: 0.529 #[m] 2026-08-31 実測 (旧 0.41) # claude
    tire_diam: 0.256  #[m] 2026-08-30 車体改修 (旧 0.15)、08-31 実測補正 (0.25 → 0.256) # claude
    gear_ratio: 92.25 # motor_rev / wheel_rev。2026-08-30 減速機交換 (旧 5.0)。モータ/エンコーダは同一個体 — bus.yml (2π/1024) は据え置き # claude
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    publish_tf: true   # claude_ekf: launch の ekf:=true 時は launch 側が後勝ちで false に上書き
    invert_left: true
    invert_right: true
    # claude_ekf: /odom の共分散対角 [x y z roll pitch yaw] (2026-08-11 追加)。
    #   robot_localization (ekf.yaml) の重み付けに使われる。z/roll/pitch は 2D では
    #   観測不能なので 1e6 で「信用しない」。vy=0.001 は差動駆動の横滑りなし拘束。
    # (1.0e6 の指数表記は YAML 1.1 パーサで文字列扱いになり得るため使わない)
    pose_covariance_diagonal:  [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]

# claude: R-Fans 新ドライバ surestar_rfans_ros2 (2026-08-14 刷新 —
#   docs/issue/2026-08-14_rfans_driver_renewal.md)。旧 SDK 用の theta_remap 等は廃止。
#   node 名 "rfans_driver" / "rfans_calculation" は rerobot_bringup.launch.py の
#   Node(name=...) と一致必須。model / device_ip / rps は launch 引数で上書き可 (後勝ち)。
rfans_driver:
  ros__parameters:
    # デバイス機種。R-Fans-32 / R-Fans-16 / R-Fans-V6K / C-Fans-128 / C-Fans-32
    model: "R-Fans-16"
    # LiDAR 実機の IP アドレス (UDP 受信元フィルタ)
    device_ip: "192.168.0.3"
    # LiDAR データ受信 UDP ポート
    device_port: 2014
    # スキャン速度 [Hz / rps]。5 / 10 / 20
    rps: 10
    # データレベル (デバイスのレジスタに書き込む出力フォーマット)。実機フラッシュ既定と同じ 3
    data_level: 3
    # true でデュアルエコー (2 反射)
    use_double_echo: false
    # 生パケットトピック名の末尾 (実トピック: /rfans_driver/rfans_packets)
    advertise_name: "rfans_packets"
    # 制御サービス名の末尾 (実サービス: /rfans_driver/rfans_control)
    control_name: "rfans_control"
    # pcap 再生 (実機レス)。空文字なら実機 (UDP) モード
    pcap: ""
    read_once: false
    read_fast: false
    repeat_delay: 0.0

rfans_calculation:
  ros__parameters:
    # 以下 4 つは rfans_driver 側と同値必須 (ROS2 にはグローバルパラメータが無いため両方に配る)
    model: "R-Fans-16"
    device_ip: "192.168.0.3"
    rps: 10
    data_level: 3
    use_double_echo: false
    # 点群トピック名の末尾 (実トピック: /rfans_driver/rfans_points)
    advertise_name: "rfans_points"
    subscribe_name: "rfans_packets"
    # 出力 PointCloud2 の header.frame_id。rerobot.urdf の rfans link 名と一致
    frame_id: "rfans"
    # 1 メッセージにまとめる回転角 [deg]。360 = 1 回転 1 メッセージ
    angle_duration: 360.0
    # 実回転数の監視 (2026-09-02 追加)。実測フレームレート (1 フレーム = 1 回転) が rps と
    # 25% 超ズレたら driver の rfans_control service へ速度を再指令する。デバイスは電源
    # 再投入で内部デフォルト 20 Hz に戻るため (起動時 1 発の指令は再送されない)、その対策。
    rps_watchdog: true
    # true なら header.stamp にデバイス GPS 時刻 (通常 false = ROS 時刻を回転幅ぶん巻き戻し)
    use_gps: false
    # 実測縦角オーバーライド [deg] (laserid 0..15 順、16 要素)。未設定 = 公式表 VAngle_V6B_16G。
    # 新ドライバ出力での再較正後にここへ入れる (旧較正値は fold16 汚染の疑いで使わない):
    # vangle_override: [-22.6, -21.0, -19.1, -18.5, -16.7, -15.7, -13.7, -13.0, -10.4, -9.6, ...]
