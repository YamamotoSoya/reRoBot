# claude: Nav2 (Navigation2) 「保存済み地図を再生する」最小構成パラメータ。
# slam_toolbox には依存せず、map_server が .pgm/.yaml を読み込む。
# claude: 2026-10-08 自己位置推定 (amcl / emcl2 …) のパラメータは config/localization/<方式>.yaml へ分離。
#
# 本機固有の前提:
#   - URDF に base_footprint は無く base_link のみ → 全 robot_base_frame を base_link に統一。
#   - 速度司令は epos4_controller が /robot_speed_cmd (素の geometry_msgs/Twist) で待ち受ける。
#     → Nav2 は既定の /cmd_vel に出し、bringup 常駐の twist_mux が joy (/joy_vel 優先) と調停して
#       /robot_speed_cmd へ流す (2026-10-16。以前は launch で直接リマップ)。stamped はここで無効化する。
#   - LaserScan は /urg_front/scan (HOKUYO UTM-30LX, frame_id=laser, FOV ±90deg) と
#     /rfans/scan (R-Fans 3D→2D, 360deg)。裸の /scan は使わない (2026-10-08)。
#   - 地図は maps/2d/<src>/<name>/nav2/map.{yaml,pgm} (コンテナ内 /workspace/maps/2d/...)。

# ============================================================================
# map_server : 保存済みの占有格子地図 (.pgm + .yaml) を読み込み /map に配信する。
#   yaml_filename は nav2.launch.py の `map` 引数で上書きされる (既定は下記)。
# ============================================================================
map_server:
  ros__parameters:
    # 読み込む地図 yaml のパス (nav2.launch.py の map 引数で上書きされる)
    yaml_filename: "/workspace/maps/2d/slam_toolbox/2026_6_9__22:00/nav2/map.yaml"

# ============================================================================
# filter_mask_server : keepout (進入禁止帯) のマスク画像を OccupancyGrid として
#   配信する map_server インスタンス。本体地図とは別の .pgm/.yaml を読む。
#   (nav2.launch.py の keepout_mask 引数で yaml_filename を上書き)
#   claude: 2026-10-16 読み手は両 costmap の keepout_static (StaticLayer)。旧 KeepoutFilter +
#   costmap_filter_info_server は廃止 (理由は local_costmap の keepout_static の注記)。
# ============================================================================
filter_mask_server:
  ros__parameters:
    # keepout マスク yaml のパス。黒 (occupied) セルが進入禁止帯になる。
    yaml_filename: "/workspace/maps/2d/slam_toolbox/2026_6_9__22:00/keep_out/keep_out.yaml"
    topic_name: "/keepout_filter_mask"  # 本体地図(/map)と分離した配信トピック
    frame_id: "map"                     # マスクを表現するフレーム

# ============================================================================
# bt_navigator : Behavior Tree で「目標への航行」全体を統括する司令塔ノード。
# ============================================================================
bt_navigator:
  ros__parameters:
    global_frame: map           # 目標位置を解釈する基準フレーム
    robot_base_frame: base_link # ロボット基準フレーム
    # claude_ekf: 2026-08-11 から EKF 融合オドメトリ (/odometry/filtered) を標準入力にする。
    #   nav2d.sh が bringup を imu:=true ekf:=true で起動する前提。EKF なしで動かすときは
    #   ここと controller_server の odom_topic を /odom に戻すこと。
    odom_topic: /odometry/filtered  # オドメトリ入力トピック (EKF 出力)
    bt_loop_duration: 10        # BT を回すループ周期 [ms]
    default_server_timeout: 20  # 各アクションサーバ応答待ちタイムアウト [ms]
    # claude: plugin_lib_names は指定しない。Jazzy の bt_navigator は標準 BT ノード
    # (ComputePathToPose 等) を内部デフォルトで自動登録するため、ここで列挙すると
    # 二重登録となり "ID [...] already registered" で segfault する。独自 BT ノードを
    # 足すとき「だけ」追加分を列挙する。

# ============================================================================
# controller_server : 局所経路追従。経路に沿う速度司令 (cmd_vel) を生成する。
#   差動二輪に素直な RegulatedPurePursuit を採用 (パラメータが少なく頑健)。
# ============================================================================
controller_server:
  ros__parameters:
    controller_frequency: 20.0       # 制御ループ周波数 [Hz]
    # claude_ekf: 現在速度のフィードバック元 (進捗判定・RPP の速度制御に使用)。
    #   既定 "odom" のままだと EKF 構成で生 /odom を読んでしまうので明示する (2026-08-11)。
    odom_topic: /odometry/filtered   # オドメトリ入力トピック (EKF 出力)
    min_x_velocity_threshold: 0.001  # この値未満の x 速度は 0 とみなす [m/s]
    min_y_velocity_threshold: 0.5    # y 速度しきい値 [m/s] (差動二輪は y=0)
    min_theta_velocity_threshold: 0.001  # 角速度しきい値 [rad/s]
    enable_stamped_cmd_vel: false    # 出力を素の Twist にする (epos4_controller 用)
    # claude: 2026-10-15 障害物で止まったら区間失敗にせず、その場で待って自動再開する。
    #   RPP の "collision ahead" 例外が続く間、controller_server が速度 0 を出し続け FollowPath を失敗させない
    #   (既定 0.0 は即失敗 → BT の RecoveryNode 6 回 → Goal failed。10-14 bag の区間失敗 3 回の経路)。
    #   -1.0 = 無期限。自力脱出 (Spin/BackUp) は起きなくなるので、塞がれたままなら人が対応する前提。
    failure_tolerance: -1.0

    # 進捗チェッカ: 一定時間内に最小距離だけ進めなければ失敗扱いにする
    progress_checker_plugin: progress_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5  # この距離 [m] 進めば前進中とみなす
      movement_time_allowance: 3600.0  # 進まないまま許容する時間 [s] (claude: 2026-10-15 10 → 3600。failure_tolerance -1 で静止待ちする間に "Failed to make progress" で落ちないように)

    # 到達判定チェッカ: 目標近傍と判定する許容誤差
    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25  # 目標位置許容誤差 [m]
      yaw_goal_tolerance: 0.25 # 目標方位許容誤差 [rad]
      stateful: true           # 位置到達後は方位合わせに専念

    # 局所制御プラグイン: Regulated Pure Pursuit
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.4          # 目標前進速度 [m/s]
      lookahead_dist: 0.6              # 先読み距離 [m]
      min_lookahead_dist: 0.3         # 最小先読み距離 [m]
      max_lookahead_dist: 0.9         # 最大先読み距離 [m]
      use_velocity_scaled_lookahead_dist: true  # 速度に応じ先読み距離を可変
      transform_tolerance: 0.2        # TF 許容ずれ [s]
      use_regulated_linear_velocity_scaling: true  # 曲率に応じ減速
      regulated_linear_scaling_min_radius: 0.9     # この曲率半径 [m] 未満で減速
      max_angular_accel: 3.2          # 最大角加速度 [rad/s^2]
      # claude: 2026-10-16 衝突先読み時間 (既定 1.0)。今の指令速度で何秒先までの footprint 掃引に致死コストが
      #   無いかを調べ、あれば "collision ahead" で速度 0 にする。追従型 BT (behavior_trees/) では旧経路が
      #   前方ロボットを貫通したまま走るので、この掃引が実質の車間。⚠️ 掃引は先読み点 (carrot) で打ち切られる
      #   (collision_checker.cpp: hypot > carrot_dist で break) ので距離 = min(2.0 s × 指令速度, 先読み距離)。
      #   先読み距離 = 実測速度 × lookahead_time 1.5 s を [0.3, 0.9] にクランプ → 走行中 0.4 m/s で 0.6 m
      #   (1.0 s では 0.4 m)、停止中は 0.3 m。前方停止物には 0.3 m まで段階的に寄る (critic 10-16 で訂正。
      #   車間を伸ばすなら min_lookahead_dist を上げる — 経路の内回りと引き換え)。
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      max_robot_pose_search_dist: 10.0  # 経路上の自己位置探索範囲 [m]
      use_rotate_to_heading: true     # 経路始端で方位合わせの旋回を許可
      rotate_to_heading_min_angle: 0.785  # この方位誤差 [rad] 以上でまず旋回
      rotate_to_heading_angular_vel: 1.0  # 方位合わせ旋回速度 [rad/s]

# ============================================================================
# local_costmap : 障害物回避用の自機周辺ローリングコストマップ。
# ============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0     # コスト更新周波数 [Hz]
      publish_frequency: 2.0    # 可視化 publish 周波数 [Hz]
      global_frame: odom        # ローカルマップ基準フレーム (オドメトリ系)
      robot_base_frame: base_link  # ロボット基準フレーム
      rolling_window: true      # 自機を中心に常時追従する窓にする
      width: 4                  # マップ幅 [m]
      height: 4                 # マップ高さ [m]
      resolution: 0.05          # 解像度 [m/cell]
      # claude: 2026-10-15 円 (robot_radius 0.35) → 実寸の四角 (base_link = 車軸中心)。実測: 幅 0.65 (車輪外面間)、車軸から前 0.14 / 後 0.51。
      #   前端は 0.14 でなく 0.325 (= 半幅) にしてある: NavFn は原点から最も近い辺までの距離 (内接半径) を障害物との
      #   最小間隔に使うので、前端 0.14 だと内接半径 0.14 < 半幅 0.325 となり planner が RPP の通れない経路を引く。
      #   効果: 内接半径 0.35 → 0.325、外接半径 0.35 → 0.60。1 m 通路の通行帯 0.30 → 0.35 m、RPP の衝突検査幅 0.72 → 0.67 m。
      #   円 0.35 は後端 0.51 を覆っていなかった (後方 0.16 m が footprint 外 = 後ろの障害物を検査していなかった)。
      footprint: "[[0.325, 0.325], [0.325, -0.325], [-0.51, -0.325], [-0.51, 0.325]]"
      # claude: 2026-10-16 keepout を filter (KeepoutFilter) から plugin (StaticLayer) へ。
      #   filter は plugins (inflation 含む) が終わった後に master へ lethal を直書きするので膨張されず、
      #   NavFn が keepout の縁から 3〜4 セルを通す経路を引き、幅 0.65 の footprint が縁に乗って RPP が
      #   collision ahead で永久停止した (10-15 bag 1752 T=327、docs/issue/2026-10-15_keepout_corridor_stall_imu_yaw_jump.md §1)。
      #   StaticLayer として inflation の前段に積めば壁と同じく 253 帯 + 勾配が付き、経路が通路中央へ寄る。
      #   副次効果: costmap_filter_info_server が不要になり、その起動失敗 (同 §6.5、bag 1728) も消える。
      plugins: ["keepout_static", "obstacle_layer", "inflation_layer"]
      # ⚠ use_maximum は StaticLayer がレイヤ名の接頭辞なし (costmap 直下) で読む Nav2 1.3.13 の仕様
      #   (static_layer.cpp: node->get_parameter("use_maximum", ...))。keepout_static の下に書いても無視され、
      #   既定 false = master を「上書き」する → 他層の値を消す。costmap 直下に置くと全 StaticLayer に効く。
      use_maximum: true                      # StaticLayer は master と max 合成 (マスクの白で他層を消さない)
      keepout_static:           # keepout マスクを静的レイヤとして取り込む (壁と同じ扱い → 膨張される)
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /keepout_filter_mask      # filter_mask_server の出力
        map_subscribe_transient_local: true  # latched なマスクを購読
        subscribe_to_updates: false
      obstacle_layer:           # LaserScan から障害物を書き込むレイヤ
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # claude: 2026-10-08 入力をセンサ別に並べる (裸の /scan は廃止)。urg を増やすときは
        #   observation_sources に urg_left / urg_right を足して同じ形のブロックを追加する (合成ノード不要)。
        #   片方のセンサを外しても expected_update_rate 既定 0 (鮮度チェックなし) なので costmap は止まらない。
        observation_sources: urg_front rfans
        # claude: 2026-10-15 inf_is_valid: true。既定 false だと +inf (無反射) の方向はレイトレースされず、そこに
        #   残った古いマーク (通り過ぎた人の尾など) が消えない。true にすると inf を range_max−ε の終点として
        #   raytrace_max_range まで消去線を引く。マークはされない (range_max 60/150 > obstacle_max_range 25 のため。
        #   obstacle_max_range を range_max 以上にすると inf 方向に偽の壁が立つので注意)。
        #   ⚠ UTM の無反射は +inf でなく 0.001〜0.004 (range_min 未満) で届く (10-14 bag、ビームの 15%) ので、
        #   urg_front 側は現状この設定が効かない。inf に変換するフィルタを挟んだときに効く。
        urg_front:
          topic: /urg_front/scan
          max_obstacle_height: 2.0   # 採用する最大高さ [m]
          clearing: true             # レイトレースで空き領域を消去
          marking: true              # 障害物として書き込み
          data_type: "LaserScan"
          inf_is_valid: true         # +inf を「そこまで空き」として消去に使う
          raytrace_max_range: 30.0   # 空き判定の最大レイトレース距離 [m]
          obstacle_max_range: 25.0   # 障害物書き込みの最大距離 [m]
        rfans:
          topic: /rfans/scan
          max_obstacle_height: 2.0   # 採用する最大高さ [m]
          clearing: true             # レイトレースで空き領域を消去
          marking: true              # 障害物として書き込み
          data_type: "LaserScan"
          inf_is_valid: true         # +inf (空ビン) を「そこまで空き」として消去に使う
          raytrace_max_range: 30.0   # 空き判定の最大レイトレース距離 [m]
          obstacle_max_range: 25.0
      inflation_layer:          # 障害物周囲を膨張させ安全マージンを作るレイヤ
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0   # 膨張コストの減衰係数 (大きいほど急減衰)
        inflation_radius: 0.55     # 膨張半径 [m]
      always_send_full_costmap: true  # 毎回フルマップを送る (差分でなく)

# ============================================================================
# global_costmap : 経路計画用の地図全体コストマップ (map_server の /map ベース)。
# ============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0     # コスト更新周波数 [Hz]
      publish_frequency: 1.0    # 可視化 publish 周波数 [Hz]
      global_frame: map         # 地図フレーム
      robot_base_frame: base_link  # ロボット基準フレーム
      # claude: 2026-10-15 円 (robot_radius 0.35) → 実寸の四角 (base_link = 車軸中心)。実測: 幅 0.65 (車輪外面間)、車軸から前 0.14 / 後 0.51。
      #   前端は 0.14 でなく 0.325 (= 半幅) にしてある: NavFn は原点から最も近い辺までの距離 (内接半径) を障害物との
      #   最小間隔に使うので、前端 0.14 だと内接半径 0.14 < 半幅 0.325 となり planner が RPP の通れない経路を引く。
      #   効果: 内接半径 0.35 → 0.325、外接半径 0.35 → 0.60。1 m 通路の通行帯 0.30 → 0.35 m、RPP の衝突検査幅 0.72 → 0.67 m。
      #   円 0.35 は後端 0.51 を覆っていなかった (後方 0.16 m が footprint 外 = 後ろの障害物を検査していなかった)。
      footprint: "[[0.325, 0.325], [0.325, -0.325], [-0.51, -0.325], [-0.51, 0.325]]"
      # claude: 2026-10-12 0.05 → 0.1 (元地図 nav2/map.yaml と同じ)。0.05 だと 7552×4352 = 33M セルを 1 Hz で全層更新 + NavFn 探索し
      #   planner_server が 1 コア常時占有 → /rfans/scan の変換が 1〜1.5 s 抜け → AMCL の map→odom TF が失効 → FollowPath 失敗
      #   (10-11 走行 bag、bags/exp/2026-10-11_amcl_load/README.md)。近距離の精度は local_costmap (0.05) が担う。
      resolution: 0.1           # 解像度 [m/cell]
      track_unknown_space: true # 未知領域を未知として扱う
      # claude: 2026-10-16 keepout を StaticLayer 化 (理由は local_costmap の keepout_static の注記)。
      #   マスクと地図は同じ 3776×2176 / 0.1 m / origin なので StaticLayer 2 枚でサイズ衝突は起きない。
      #   ⚠ use_maximum は costmap 直下に置く (local_costmap の注記参照)。レイヤ配下だと無視されて既定の「上書き」になり、
      #     後の StaticLayer が前の StaticLayer の値を消す (10-16 隔離ドメインの試験で lethal 数が片方の占有数と一致して発覚)。
      #     master は毎周期 既定値 (unknown) に戻ってから各層が書くので、max 合成なら順序によらず地図 ∪ keepout になる。
      plugins: ["static_layer", "keepout_static", "obstacle_layer", "inflation_layer"]
      use_maximum: true         # StaticLayer (static_layer / keepout_static の両方) を master と max 合成にする
      keepout_static:           # keepout マスクを静的レイヤとして取り込む (壁と同じ扱い → 膨張される)
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /keepout_filter_mask      # filter_mask_server の出力
        map_subscribe_transient_local: true  # latched なマスクを購読
        subscribe_to_updates: false
      static_layer:             # map_server の /map を静的レイヤとして取り込む
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true  # latched な /map を購読
      obstacle_layer:           # LaserScan によるリアルタイム障害物反映
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # claude: 2026-10-08 入力をセンサ別に並べる (裸の /scan は廃止)。urg を増やすときは
        #   observation_sources に urg_left / urg_right を足して同じ形のブロックを追加する (合成ノード不要)。
        #   片方のセンサを外しても expected_update_rate 既定 0 (鮮度チェックなし) なので costmap は止まらない。
        # claude: 2026-10-12 global は rfans のみ (urg_front は 40 Hz × 1080 本の変換負荷が大きく、0〜5 m の障害物は local が urg 込みで見る)。
        #   戻すときは `urg_front rfans` に (下の urg_front ブロックは残してある)。
        observation_sources: rfans
        # claude: 2026-10-04 obstacle_max_range 25.0 → 5.0。12〜25 m の /scan (R-Fans 由来) 終点の約 6 割が
        #   地面ゴースト (坂・−1° リング) で、global は累積するので見えない壁が溜まる。遠方の静的構造は
        #   static_layer (/map) が持つので、動的障害物は近距離だけ書けば足りる。
        #   (docs/trial/improvements.md 10-03 メモ P0①)。urg 側も同じ値に揃えている。
        # claude: 2026-10-10 min_obstacle_height -0.3 (既定 0.0)。高さ判定は global_frame (map) 座標の z で行われ、
        #   /rfans/scan の点は base_link 基準 z = 0 ちょうど → map から見たロボットの z がわずかでも負だと消える
        #   (AMCL 構成は map->odom の z = 0 ちょうどで偶然通っていた)。3D 自己位置推定 (nav_lidar3d) では
        #   map_level_bridge が z を ±1 cm に打ち消すが、その残差でも消えないよう下限を下げる。入力は高さ切り出し済みの
        #   LaserScan なので、下限を下げても地面等の余計な点は入らない (docs/features/2026-10-10_lidar_localization_3d.md §2.2)。
        urg_front:
          topic: /urg_front/scan
          min_obstacle_height: -0.3  # 採用する最小高さ [m] (map 座標)
          max_obstacle_height: 2.0   # 採用する最大高さ [m]
          clearing: true             # レイトレースで空き領域を消去
          marking: true              # 障害物として書き込み
          data_type: "LaserScan"
          raytrace_max_range: 10.0   # 空き判定の最大レイトレース距離 [m] (claude: 2026-10-12 30→10。marking は 5 m までなので 10 m 超の消去線は無駄)
          obstacle_max_range: 5.0
        rfans:
          topic: /rfans/scan
          min_obstacle_height: -0.3  # 採用する最小高さ [m] (map 座標、urg_front の注記参照)
          max_obstacle_height: 2.0   # 採用する最大高さ [m]
          clearing: true             # レイトレースで空き領域を消去
          marking: true              # 障害物として書き込み
          data_type: "LaserScan"
          raytrace_max_range: 10.0   # 空き判定の最大レイトレース距離 [m] (claude: 2026-10-12 30→10。marking は 5 m までなので 10 m 超の消去線は無駄)
          obstacle_max_range: 5.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

# ============================================================================
# planner_server : 全体経路計画。NavFn (ダイクストラ/A*) で map 上の経路を生成。
# ============================================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0   # 計画要求の想定周波数 [Hz] (claude: 2026-10-12 20→1。警告の閾値のみ。実際の要求は BT の RateController 0.333 Hz)
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5      # 目標に到達できない時の許容半径 [m]
      use_astar: true     # false=ダイクストラ, true=A* (claude: 2026-10-12 true。探索セル数を減らす。経路が壁寄りになるなら false に戻す)
      allow_unknown: true # 未知領域の通過を許可

# ============================================================================
# behavior_server : 復帰行動 (旋回・後退・待機) を提供するサーバ。
# ============================================================================
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw       # 衝突判定に使うローカルコスト
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0          # 行動実行ループ周波数 [Hz]
    enable_stamped_cmd_vel: false  # 復帰行動の速度司令も素の Twist で出す
    behavior_plugins: ["spin", "backup", "wait"]
    spin:                          # その場旋回
      plugin: nav2_behaviors::Spin
    backup:                        # 後退
      plugin: nav2_behaviors::BackUp
    wait:                          # 待機
      plugin: nav2_behaviors::Wait
    local_frame: odom              # 局所行動の基準フレーム
    global_frame: map              # 大域基準フレーム
    robot_base_frame: base_link    # ロボット基準フレーム
    transform_tolerance: 0.1       # TF 許容ずれ [s]
    simulate_ahead_time: 2.0       # 衝突予測の先読み時間 [s]
    max_rotational_vel: 1.0        # 最大旋回速度 [rad/s]
    min_rotational_vel: 0.4        # 最小旋回速度 [rad/s]
    rotational_acc_lim: 3.2        # 旋回加速度上限 [rad/s^2]
