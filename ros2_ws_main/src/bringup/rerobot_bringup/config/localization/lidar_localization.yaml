# claude: 2026-10-10 新設。lidar_localization_ros2 (rsasaki0109, submodule v1.3.0: ros2_ws_main/src/localization/)
# のパラメータ。読み手: launch/parts/localization/loc_lidar3d.launch.py。
# 上流の推奨プリセット param/nav2_ndt_urban.yaml を先に読み、このファイルを後から重ねる (= ここに書いた値が勝つ)。
# ここに書くのは本機の差分だけ (未チューニング)。設計は docs/features/2026-10-10_lidar_localization_3d.md。
#
# 入出力 (全 localization 方式共通の約束): 出力 = TF map->odom、入力 = /initialpose + TF odom->base_link。
#   ただし本方式は 2 段: 本体が TF map_3d->odom を出し、map_level_bridge.py が TF map->map_3d (z の打ち消し) を出す。
#   lidar_localization 固有の出力: /pcl_pose (map_3d 座標), /path, /alignment_status, /reinitialization_requested, /initial_map
lidar_localization:
  ros__parameters:
    # ---- 座標系 ----
    global_frame_id: map_3d        # 3D 地図の座標系。Nav2 の map とは分け、間を map_level_bridge が繋ぐ
    odom_frame_id: odom
    base_frame_id: base_link       # LiDAR (rfans) / IMU (imu_link) への TF はここから引く (URDF 由来)
    enable_map_odom_tf: true       # map_3d->odom を出す。odom->base_link は EKF が出す
    level_map_to_odom: true        # map_3d->odom の roll / pitch を 0 にする (z は残る → bridge が消す)
    # claude: 2026-10-22 map_3d->odom の stamp を未来へずらす [s] (submodule にローカル追加したパラメータ、既定 0)。
    #   scan stamp のままだと届いた時点で median 0.15 / max 0.49 s 古く、RPP が毎周期 TF 待ち → 制御 20→5 Hz、
    #   0.2 s 待ちきれず abort (bag 2026-10-22_1743)、人に止められた後の旋回の発振 (bag 1756_tolC)。AMCL の transform_tolerance と同じ役割
    map_odom_tf_future_dating_sec: 0.5

    # ---- 地図 ---- (map_path は launch から渡す)
    use_pcd_map: true

    # ---- 照合 ----
    ndt_resolution: 2.0            # プリセット 1.0。16 ラインは点が疎なので粗め (つくば 2456 Abudori は 5.0、5.0 とも比べる)
    scan_period: 0.1               # R-Fans 10 Hz
    scan_min_range: 1.0            # 車体自身の点を除く
    point_timestamp_unit: seconds  # R-Fans の点ごとの "time" は float32 の相対秒 (auto でも判定されるが明示する)

    # ---- 予測 (照合の初期値 = seed) ---- 照合が痩せる区間を EKF (車輪 + IMU) で持ちこたえる
    # seed の優先順 (include/lidar_localization/registration_seed_policy.hpp): odom_tf → imu → gtsam → twist_ekf
    #   → twist_prediction → previous_delta (プリセット true = 等速外挿) → current_pose。
    # use_odom (twist 積分) はこの順に入らず、previous_delta に負けて実質使われない (critic 査読 2026-10-10) ので、
    # 最優先の odom_tf を使う: seed = 最後に照合が通った map_3d->odom × いまの EKF odom->base_link。
    # 照合が 1 度も通っていない間 (起動直後) は previous_delta / 初期位置にフォールバックする。
    use_odom_tf_prediction: true
    use_odom: false
    use_twist_prediction: false    # プリセットは true (/twist 入力)。seed の入口を odom_tf 1 本に絞る

    # ---- IMU ---- seed の 2 番手 (odom_tf が使えるときは odom_tf が勝つ)。最初は OFF。動作確認後に ON / OFF で A/B する (2456 Abudori は安価 IMU の横移動バイアスで無効化)
    use_imu_preintegration: false
    # ON にするとき必須: BNO086 は上下逆 + yaw −93° 取付。false (既定) だと IMU 値をセンサ座標のまま使ってしまう
    imu_preintegration_use_base_frame_transform: true

    # ---- 処理速度 ---- (claude: 2026-10-11 bag 再生評価 bags/exp/2026-10-11_loc_eval で決めた。経緯は tools/loc_eval/README.md)
    #   上流プリセットのままだと 1 スキャン 0.6〜0.8 s + 局所地図の再構築 (10 m ごと、約 10 s 停止) で姿勢の鮮度 p95 8.5 s。
    #   scan voxel 0.3 m で 1 スキャン 0.2 s・精度不変 (0.5 m は全棄却)。局所地図の縮小 (radius 60) は照合を壊す (86/113 棄却)
    #   ので切り出し自体を止め、全地図 (1643 5号館 map.pcd = 全高さ 639 万点) を起動時に 1 回だけ NDT 目標にする → 鮮度 p95 0.5 s。
    enable_scan_voxel_filter: true   # プリセット false
    voxel_leaf_size: 0.3
    enable_local_map_crop: false     # プリセット true (radius 150 m = この地図ではほぼ全体、10 m ごと再構築)
