# claude: 2026-10-08 nav2_params.yaml から amcl 節を移設 (自己位置推定の方式別ファイル化)。
# 読み手: launch/parts/localization/loc_amcl.launch.py (本番) / launch/amcl_variants.launch.py (並走比較)。
# 入出力の約束 (全 localization 方式共通): 出力 = TF map->odom、入力 = /initialpose + TF odom->base_link。

# ============================================================================
# amcl : Adaptive Monte Carlo Localization。/scan と /map を突き合わせて自己位置を
#   推定し、map->odom TF を publish する (slam_toolbox の代替)。
# ============================================================================
amcl:
  ros__parameters:
    global_frame_id: map         # 推定結果を表現する地図フレーム
    odom_frame_id: odom          # オドメトリフレーム
    base_frame_id: base_link     # ロボット基準フレーム
    scan_topic: /rfans/scan      # 入力 LaserScan (claude: 2026-10-08 scan → /rfans/scan。実際は nav 構成の scan_topic 引数で上書き)
    robot_model_type: nav2_amcl::DifferentialMotionModel  # 差動二輪の運動モデル

    # ---- パーティクル数 ----
    min_particles: 500           # 最小パーティクル数
    max_particles: 2000          # 最大パーティクル数
    update_min_d: 0.25           # この距離 [m] 動いたら更新
    update_min_a: 0.2            # この角度 [rad] 回ったら更新
    resample_interval: 1         # 何回更新ごとにリサンプリングするか
    # claude: 2026-10-15 1.0 → 8.0 → 2026-10-16 2.0。
    #   8.0 にした動機: R-Fans 回転ディップ (10-14 bag 757〜768 s: scan_all が 6.7 s 途絶) で map→odom が失効し
    #   controller が "Unable to transform robot pose" (error_code 102) → 即 Goal failed。
    #   8.0 の副作用 (10-15 bag 1802 で判明): AMCL は map→odom に「scan 時刻 + tolerance」の未来日付を付けるので、
    #   Time(0) で引く Nav2 には「tolerance 秒前の補正」が返る。8.0 だと AMCL の 2.97 m 跳びが 7.8 s 遅れて届き
    #   "Resulting plan has 0 poses" (103) で abort (docs/issue/2026-10-15_keepout_corridor_stall_imu_yaw_jump.md §2)。
    #   → 短いほど自己位置の反映が速い。ディップ耐性は tolerance ではなく map_odom_holder.py (AMCL が黙ったら
    #   最後の map→odom を出し続ける見張り番、loc_amcl.launch.py が起動) が持つ。2.0 = scan_all の受信穴 (最大 0.53 s) の 4 倍。
    #   ⚠ 上限: TF バッファ保持 10 s と同値の 10.0 は「今」より古い TF が全部捨てられ即失敗 (10-15 実走で再現)。
    transform_tolerance: 2.0     # publish する TF の未来側有効時間 [s] (= Nav2 から見た補正の遅れ)

    # ---- レーザ尤度モデル (likelihood_field) ----
    laser_model_type: likelihood_field_prob  # 尤度場モデル
    laser_likelihood_max_dist: 2.0      # 尤度場で考慮する最大距離 [m]
    laser_max_range: 100.0              # 採用する最大レーザ距離 [m] (claude 2026-10-12: 30→100、照合用地図 raw_traj/*_r100 (range 100) と揃える。bag 評価では 30 と差なし)
    laser_min_range: -1.0               # -1=デバイス既定の最小距離を使用
    max_beams: 60                       # 1 スキャンで使うビーム本数
    z_hit: 0.5                          # ヒット項の重み
    z_rand: 0.5                         # ランダムノイズ項の重み
    sigma_hit: 0.2                      # ヒット項のガウス標準偏差 [m]

    # ---- 差動運動モデルのノイズ ----
    # claude 2026-10-12: alpha1〜4 を既定 0.2 → 0.02。bag 再生評価 (docs/issue/2026-10-11_loc_eval_2d_corner_loss_vs_3d.md) で
    #   0.2 は EKF odom の実力 (回頭ずれ ≤0.9°/10 s) に対して過大 (0.25 m ごとにヨー ≈9° をばらまく) で、東端の角で発散して戻らず、
    #   全点スキャンでも南通路で粒子が 10〜20 m に割れた。0.02 で全構成 0.51〜0.63 m・見失いなし (1611 bag、8 run)。
    #   ⚠ オドメトリが滑る状況 (空転・EPOS 一時停止) では追従できず見失う可能性 — 実機で要確認。
    alpha1: 0.02  # 回転に対する回転ノイズ
    alpha2: 0.02  # 並進に対する回転ノイズ
    alpha3: 0.02  # 並進に対する並進ノイズ
    alpha4: 0.02  # 回転に対する並進ノイズ

    # ---- 自己位置喪失からの復帰 ----
    recovery_alpha_slow: 0.0     # 低速平均尤度 (0=無効)
    recovery_alpha_fast: 0.0     # 高速平均尤度 (0=無効)
    set_initial_pose: false      # 起動時に初期姿勢を固定値で与えるか
    always_reset_initial_pose: false  # 再起動時に初期姿勢を毎回リセットするか
    # claude: 2026-10-24 人垣試験用 — likelihood_field_prob + beam skip。粒子の多数で「地図の障害物から
    #   beam_skip_distance 以上離れた終点」になるビームをその更新で無視する (動的障害物対策)。
    #   捨てる割合が beam_skip_error_threshold を超えたら全ビームを使う (全部捨てて盲目になる安全弁)。
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
