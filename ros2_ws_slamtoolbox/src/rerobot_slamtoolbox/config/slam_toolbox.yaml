# claude: slam_toolbox (async) 用パラメータ。本リポジトリ専用に書き起こした最小セット。
# 本機 URDF には base_footprint が無く base_link しかないため、base_frame を必ず
# base_link に上書きすること (slam_toolbox の既定値は base_footprint)。
slam_toolbox:
  ros__parameters:
    # ---- Plugin / solver ----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---- ROS frames / topics (本リポジトリ固有の修正) ----
    odom_frame: odom
    map_frame: map
    base_frame: base_link        # 既定 base_footprint からの上書き (本件の本丸)
    scan_topic: /scan
    use_map_saver: true
    mode: mapping                # mapping or localization
    # claude: Jazzy 配布の slam_toolbox では autostart パラメータが機能しなかった
    # ため、自動 configure→activate は slam.launch.py 側の EmitEvent チェーンで
    # 行っている。autostart の値はここでは効果なしだが、将来 slam_toolbox 側で
    # 直ったときの保険として true で残す。
    autostart: true

    # ---- Mapping behavior ----
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    # claude: 5.0→2.0 s (2026-08-01)。/map の再生成・配信周期 (RViz の見た目の更新)。
    # 地図が大きくなるほど 1 回の再生成が重くなるので、広域マッピングで重ければ戻す。
    map_update_interval: 2.0
    resolution: 0.05
    min_laser_range: 0.0
    max_laser_range: 30.0
    minimum_time_interval: 0.5
    # claude: tf2_ros::MessageFilter のキュー長。slam_toolbox の素のデフォルトは 1 で、
    # /scan 40Hz と /odom 20Hz (= odom→base_link TF が 50ms 周期) の組み合わせでは、
    # 各 scan で「TF buffer 最新 < scan.stamp」が常に起き、次の odom TF を待つ間にすぐ
    # キューが overflow して "queue is full" で全 scan が drop される。10 まで広げて
    # 50ms 程度のラグを吸収できるようにする。
    scan_queue_size: 10
    # claude: scan stamp と TF stamp の余裕。0.2s でも理屈上は足りるが、起動直後の
    # TF buffer ウォームアップやレート揺らぎを吸うため 0.5s に拡張。
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # ---- Loop closure / scan matching (defaults; tune later) ----
    use_scan_matching: true
    use_scan_barycenter: true
    # claude: 0.5→0.2 m (2026-08-01)。スキャン追加の距離ゲートを詰めて地図更新を細かくする。
    # 併せて minimum_time_interval (0.5s) のゲートも効く点に注意 — 0.2m を 0.5s より
    # 速く進む速度 (>0.4 m/s) では時間ゲート側が律速になる。
    minimum_travel_distance: 0.2
    # claude: 0.5→0.25 rad (≈14°)。旋回時のスキャン追加も細かく (距離と旋回は OR 判定)。
    minimum_travel_heading: 0.25
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
