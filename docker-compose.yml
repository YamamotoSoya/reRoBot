# claude: 機能別コンテナ構成 (2026-07-26 再編)。分割基準は「依存の壁」:
#   main        — CAN モータ制御 + センサドライバ + odometry + Nav2 + teleop (常用、profile なし)
#   slamtoolbox — slam_toolbox 2D mapping (profile: slamtoolbox)
#   glim        — 3D SLAM GLIM。公式イメージ (GTSAM 4.3a0 同梱) ベースの Dockerfile_glim (profile: glim)
#   liosam      — LIO-SAM。GTSAM 4.2.0 (ros-jazzy-gtsam)。IMU 再入手まで凍結 (profile: liosam)
# 全サービス共通:
#   network_mode: host + ipc: host + ROS_DOMAIN_ID=150 → コンテナ間は DDS で疎通。
#   ipc: host は FastDDS の共有メモリ転送に必須 (無いと topic list に見えるのに echo できない事故になる)。
#   コンテナは bash 常駐。起動は scripts/*.sh が docker exec で launch を投入する方式。
services:
  main:
    container_name: rerobot_env
    network_mode: host
    ipc: host
    build:
      context: ./docker
      dockerfile: Dockerfile_main
    tty: true
    stdin_open: true
    privileged: true # claude: /dev の CAN・USB(LiDAR/RealSense/pad) アクセスに必要
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=150 # claude: docker exec bash -c は .bashrc を読まないためここが正
    volumes:
      - ./ros2_ws_main/src:/workspace/src
      - ./maps:/workspace/maps
      - ./bags:/workspace/bags
      - ./tools:/workspace/tools   # claude: 2026-10-01 追加 (tools/amcl_compare を main 内で実行するため。glim と同じ)。⚠ /workspace 配下なので colcon が tools/ を拾う → tools/COLCON_IGNORE で除外
      - main_build:/workspace/build
      - main_install:/workspace/install
      - main_log:/workspace/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    command: bash

  slamtoolbox:
    container_name: slamtoolbox_env
    profiles: [slamtoolbox]
    network_mode: host
    ipc: host
    build:
      context: ./docker
      dockerfile: Dockerfile_slamtoolbox
    tty: true
    stdin_open: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=150
    volumes:
      - ./ros2_ws_slamtoolbox/src:/workspace/src
      - ./maps:/workspace/maps # claude: slam_toolbox の地図保存先
      - slamtoolbox_build:/workspace/build
      - slamtoolbox_install:/workspace/install
      - slamtoolbox_log:/workspace/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash

  glim:
    container_name: glim_env
    profiles: [glim]
    network_mode: host
    ipc: host
    # claude: GPU 描画の有効化は docker-compose.override.yml (git 管理外、GPU 機のみに置く) で行う。
    # ここに gpus: を直書きすると GPU なし PC で glim コンテナが作成不能になるため書かないこと (2026-08-17)。
    # claude: GPU で「演算」まで行う構成は下の glim_gpu サービス (profile: glim_gpu) を使う (2026-10-07)。
    # こちらの glim は全 PC 共通の CPU 構成として維持する。
    # claude: koide3 公式イメージ (GLIM ビルド済み + GTSAM 4.3a0 同梱) ベースの薄い Dockerfile。
    # GLIM 本体はビルドしない。設定は ./ros2_ws_glim/config を bind mount し、glim_rosnode に config_path で渡す。
    build:
      context: ./docker
      dockerfile: Dockerfile_glim
    tty: true
    stdin_open: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=150
      - GSK_RENDERER=cairo # claude: zenity 4 (GTK4) の GL 描画が CRD の X (DRI3 なし) で失敗し offline_viewer のダイアログが不可視になるため cairo に固定 (docs/issue/2026-08-15_offline_viewer_zenity_dialog_hang.md)
    volumes:
      - ./ros2_ws_glim/config:/glim_config
      - ./maps:/workspace/maps # claude: 2026-08-15 他コンテナと同じ /workspace 配下に統一
      - ./bags:/workspace/bags # claude: glim_rosbag でのオフライン評価用
      - ./tools:/workspace/tools # claude: 2026-08-17 pointcloud_to_2dmap (3D 地図→2D 占有格子変換) のビルド場所。成果物をホスト側に永続化
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash

  # claude: GLIM の GPU 版 (2026-10-07 追加、profile: glim_gpu)。CPU 版 (glim) とは
  # イメージもコンテナも分ける方式 — 同じ Dockerfile_glim を ARG GLIM_BASE で CUDA ビルド版に
  # 差し替えて建てる。profile を有効にしない限り compose はこのサービスを一切触らないので、
  # GPU を持たない PC では存在しないのと同じ (gpus: を直書きしても作成不能にならないのはこのため)。
  # scripts/build.sh の images ループにも入れていない — GPU 機だけが明示的に建てる。
  #   建て方: ./scripts/build.sh glim_gpu   (= docker compose --profile glim_gpu build glim_gpu)
  #   起動  : docker compose --profile glim_gpu up -d glim_gpu
  # ⚠️ CUDA 13 は Pascal (GTX 1080 = compute capability 6.1) のサポートを削除済み → cuda12.x を使う。
  # ⚠️ CPU 版と同時に起動しない (どちらも network_mode: host + 同じ ROS_DOMAIN_ID でトピックが衝突する)。
  glim_gpu:
    container_name: glim_gpu_env
    profiles: [glim_gpu]
    network_mode: host
    ipc: host
    gpus: all # claude: CUDA 演算 (VGICP_GPU) と GL 描画の両方に必要
    build:
      context: ./docker
      dockerfile: Dockerfile_glim
      args:
        # claude: CUDA ビルド版は CPU 版の上位互換 (GLIM の CMake は CPU 系モジュールを無条件に
        # ビルドし、BUILD_WITH_CUDA で GPU 版 odometry を追加する)。
        GLIM_BASE: koide3/glim_ros2:jazzy_cuda12.5
    tty: true
    stdin_open: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=150
      - GSK_RENDERER=cairo
      - NVIDIA_DRIVER_CAPABILITIES=all # claude: 既定 (compute,utility) だと libnvidia-gl が注入されず GL が CPU 描画に落ちる
    volumes:
      # claude: 設定は CPU 版と同じディレクトリを共有し、入口の config.json だけ GPU 版を被せる
      # (入れ子 bind)。sensors / preprocess / ros 等の調整は両方に同時に効き、二重管理にならない。
      # 被せているおかげで config_path は CPU 版と同じ /glim_config のままで済む。
      - ./ros2_ws_glim/config:/glim_config
      - ./ros2_ws_glim/config/config.gpu.json:/glim_config/config.json:ro
      - ./maps:/workspace/maps
      - ./bags:/workspace/bags
      - ./tools:/workspace/tools
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash

  liosam:
    container_name: liosam_env
    profiles: [liosam]
    network_mode: host
    ipc: host
    build:
      context: ./docker
      dockerfile: Dockerfile_liosam
    tty: true
    stdin_open: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=150
    volumes:
      - ./ros2_ws_liosam/src:/workspace/src
      - ./maps:/workspace/maps
      - ./bags:/workspace/bags
      - liosam_build:/workspace/build
      - liosam_install:/workspace/install
      - liosam_log:/workspace/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash

volumes:
  main_build:
  main_install:
  main_log:
  slamtoolbox_build:
  slamtoolbox_install:
  slamtoolbox_log:
  liosam_build:
  liosam_install:
  liosam_log:
